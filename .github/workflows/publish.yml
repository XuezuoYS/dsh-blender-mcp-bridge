# Publish the package to npm from GitHub Actions.
#
# Trusted publishing is the recommended path and needs no long-lived token:
#   1. Publish the first version once from a local machine (`npm login`, then
#      `npm publish`) so the package exists on npmjs.com.
#   2. On npmjs.com -> the package -> Settings -> Trusted publishing, add
#      GitHub Actions with owner XuezuoYS, repository dsh-blender-mcp-bridge,
#      workflow filename publish.yml, and allow "npm publish".
#   3. Create the annotated tag locally, then push the tag and the release
#      branch:
#        git tag -a v0.1.1 -m "v0.1.1"
#        git push origin v0.1.1
#        git push origin release
#   4. The workflow publishes the version in package.json and creates a GitHub
#      release on that tag (title and tag vX.Y.Z, body "无更新日志").
#
# A release branch push without an annotated vX.Y.Z tag on the same commit
# only runs the lightweight detect job; publish and release are skipped.
#
# npm requires CLI 11.5.1+ for OIDC auth; Node 24 on GitHub-hosted runners
# already ships a compatible npm.
#
# For a token-based first publish, uncomment the NODE_AUTH_TOKEN block on the
# Publish step and add an npm automation token as the NPM_TOKEN repository
# secret.

name: Publish to npm

on:
  push:
    branches:
      - release

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find the annotated tag for this commit
        id: release-tag
        run: |
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          tag="v$version"
          type="$(git cat-file -t "refs/tags/$tag" 2>/dev/null || true)"
          commit="$(git rev-parse "$tag^{commit}" 2>/dev/null || true)"
          if [ "$type" = "tag" ] && [ "$commit" = "$GITHUB_SHA" ]; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "found annotated tag $tag on $GITHUB_SHA"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "::notice::no annotated tag $tag on $GITHUB_SHA (type=${type:-missing}, tag_commit=${commit:-none}); skipping npm publish and GitHub release"
          fi

  publish:
    needs: detect
    if: needs.detect.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Publish
        run: npm publish
        # Token fallback for the first publish:
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists"
            exit 0
          fi
          gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "无更新日志"
