# dsh-blender-mcp-bridge — DSH bundle patch
#
# The entry has the same id as the package name so the profile can target it
# with per-key overrides. The values below are the bundled defaults: they seed
# the plugin's own settings files on first run (DSH_HOME/dsh-blender-mcp-bridge/
# connection.json, snapshot.json, safety.json, task.json, helper.json) and are
# not the runtime source of truth after that. The settings page edits the JSON
# files; profile overrides are ignored once those files exist.
- insert:
    - id: dsh-blender-mcp-bridge
      name: dsh-blender-mcp-bridge
      config:
        host: 127.0.0.1
        port: 9876
        maxConcurrentSends: 5
        connectTimeoutMs: 5000
        responseTimeoutMs: 30000
        captureTimeoutMs: 30000
        renderTimeoutMs: 120000
        maxResponseChars: 200000
        taskRootMode: blendFile
        taskRoot: ''
        snapshot:
          enabled: true
          generations: 3
          on: adaptive
          everyWrites: 10
          onDestructive: true
          compress: true
          timeoutMs: 120000
        guard:
          enabled: true
        helper:
          basePython: ''
          pipIndexUrl: ''
          timeoutMs: 120000
          maxOutputChars: 200000
          enableMaintenanceHelpers: false
        audit:
          enabled: true
          storeCode: false
