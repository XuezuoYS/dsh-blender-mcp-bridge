# profile bundle 补丁：把插件插进目标 profile 的 Cordis 图。
# 补丁层语义是「按行整体替换 config，不做深合并」，因此这里列出 Config 全集，
# 用户覆盖时必须重述所有键（见 docs/contract.md#config）。
#
# 注意：这是 **YAML**，注释只能用 `#`。写成 `//` 会让整个文件解析失败
# （YAMLException: end of the stream or a document separator is expected）——
# 实测踩过：那样插件安装时会在解析 overlay 这一步直接失败。

- insert:
    - id: blender-mcp-bridge
      name: dsh-blender-mcp-bridge
      config:
        # 端点发现
        host: 127.0.0.1
        port: 9876
        portCandidates: []
        allowPortScan: false
        connectTimeoutMs: 10000
        responseTimeoutMs: 30000
        deferredTimeoutMs: 3600000
        maxResponseChars: 200000
        rejectForeignPeer: true
        # 必须加引号：不加会被 YAML 解析成数字 5.1，而 schema 要的是字符串，
        # 结果是加载期 ValidationError（实测踩过）
        requireVersionMin: '5.1'
        # 任务目录
        # 留空表示按 taskRootMode 决定；给了绝对路径则以 taskRoot 为准。
        taskRoot: ''
        # 产出放哪：blendFile（默认，活动 .blend 文件所在目录下）| workspace（会话工作区）
        # ⚠️ 任务目录的位置就是护栏 allowRoot 的位置；blendFile 让它跟着工程文件走
        # （可写范围仍只有工程目录下的那一个子目录，**这不是安全边界，只防误操作**）。
        taskRootMode: blendFile
        # 检查点
        checkpoint:
          enabled: true
          keep: 3
          maxBytes: 0
        # 拦截层
        intercept:
          enabled: true
          guardThreadScope: main
        # 官方知识库：语料与索引随包内置，无可开关（I21）。
        # 这里只有「模型侧 token 预算」两个参数是配置。
        knowledge:
          maxHits: 8
          maxCharsPerHit: 4000
        # 工具面
        expose:
          status: true
          exec: true
          inspect: true
          capture: true
          snapshot: true
          docs: true
