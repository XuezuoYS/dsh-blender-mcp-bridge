# dsh-blender-mcp-bridge — DSH bundle patch
#
# The entry has the same id as the package name so the profile can target it
# with per-key overrides. Config defaults also live in the plugin's Config
# schema; this block lists the full set so the active values are visible.
- insert:
    - id: dsh-blender-mcp-bridge
      name: dsh-blender-mcp-bridge
      config:
        host: 127.0.0.1
        port: 9876
        connectTimeoutMs: 5000
        responseTimeoutMs: 30000
        captureTimeoutMs: 30000
        renderTimeoutMs: 120000
        maxResponseChars: 200000
        taskRootMode: blendFile
        taskRoot: ''
        snapshot:
          enabled: true
          generations: 3
          on: turn
          compress: true
          timeoutMs: 120000
        guard:
          enabled: true
        helper:
          analysisPython: ''
          autoDetectPython: true
          timeoutMs: 120000
          maxOutputChars: 200000
          enableMaintenanceHelpers: false
        audit:
          enabled: true
          storeCode: false
